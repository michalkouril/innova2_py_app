# DKMS packaging for innova2_areg.
#
# WHY DKMS: this module is the only way to get image-select and the JTAG grant on a kernel whose
# mlx5 has no FPGA chardev, and it is bound to mlx5_core's symbol CRC -- so it MUST be rebuilt
# whenever the kernel or OFED changes. DKMS does that automatically; a hand-built .ko silently
# stops loading after the next kernel update, which looks exactly like the card having died.
#
# The Makefile finds the right Module.symvers for ${kernelver} itself (OFED's when OFED supplies
# mlx5, the kernel's own otherwise), so nothing here has to know which stack is installed.
PACKAGE_NAME="innova2-areg"
PACKAGE_VERSION="1.0"
BUILT_MODULE_NAME[0]="innova2_areg"
DEST_MODULE_LOCATION[0]="/extra"
MAKE[0]="make KVER=${kernelver} KDIR=/lib/modules/${kernelver}/build all"
CLEAN="make KVER=${kernelver} KDIR=/lib/modules/${kernelver}/build clean"
AUTOINSTALL="yes"
